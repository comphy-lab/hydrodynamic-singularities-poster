<text x="63" y="686" fill="#17202A" font-size="12.6" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="850" text-anchor="start"><tspan x="63" dy="0.00">1. What becomes</tspan><tspan x="63" dy="15.37">singular?</tspan></text>
<text x="63" y="733" fill="#4B5563" font-size="8.0" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start"><tspan x="63" dy="0.00">A smooth interface develops a neck,</tspan><tspan x="63" dy="9.76">bridge, rim, or tip whose local</tspan><tspan x="63" dy="9.76">length scale becomes much smaller</tspan><tspan x="63" dy="9.76">than the surrounding flow. The global</tspan><tspan x="63" dy="9.76">object looks simple; the decisive</tspan><tspan x="63" dy="9.76">physics lives in a small inner</tspan><tspan x="63" dy="9.76">region.</tspan></text></g>
<g><rect x="310" y="642" width="236" height="248" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<rect x="310" y="642" width="236" height="20" rx="6" fill="#EFF6FF"/>
<text x="323" y="686" fill="#17202A" font-size="12.6" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="850" text-anchor="start"><tspan x="323" dy="0.00">2. What resolves it?</tspan></text>
<text x="323" y="733" fill="#4B5563" font-size="8.0" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start"><tspan x="323" dy="0.00">Inertia, viscosity, surface tension,</tspan><tspan x="323" dy="9.76">gas flow, contact-line physics,</tspan><tspan x="323" dy="9.76">elasticity, and molecular cutoffs can</tspan><tspan x="323" dy="9.76">each set the final balance. The</tspan><tspan x="323" dy="9.76">useful question is not just whether</tspan><tspan x="323" dy="9.76">breakup happens, but which balance</tspan><tspan x="323" dy="9.76">controls the path.</tspan></text></g>
<g><rect x="570" y="642" width="236" height="248" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
<rect x="570" y="642" width="236" height="20" rx="6" fill="#EFF6FF"/>
<text x="583" y="686" fill="#17202A" font-size="12.6" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="850" text-anchor="start"><tspan x="583" dy="0.00">3. Why should students</tspan><tspan x="583" dy="15.37">care?</tspan></text>
<text x="583" y="733" fill="#4B5563" font-size="8.0" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start"><tspan x="583" dy="0.00">A tiny region controls printing,</tspan><tspan x="583" dy="9.76">spraying, foams, emulsions, bubbles,</tspan><tspan x="583" dy="9.76">jets, and soft biological flows.</tspan><tspan x="583" dy="9.76">Singularities are where continuum</tspan><tspan x="583" dy="9.76">mechanics shows both its power and</tspan><tspan x="583" dy="9.76">its limits.</tspan></text></g>
